basePath: /
definitions:
  app.Email:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  app.GUIDstr:
    properties:
      uuid:
        type: string
    required:
    - uuid
    type: object
  storage.Tokens:
    properties:
      authorisation:
        type: string
      refresh:
        type: string
      uuid:
        type: string
    required:
    - authorisation
    - refresh
    - uuid
    type: object
  storage.User:
    properties:
      email:
        type: string
      uuid:
        type: string
    required:
    - uuid
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API server for authorisation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: TODO App API
  version: "1.0"
paths:
  /about:
    get:
      description: Retrieve information about the currently authorized user
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user information
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get information about authorized user
      tags:
      - Auth
  /login:
    post:
      consumes:
      - application/json
      description: Login by UUID and receive JWT and refresh token
      parameters:
      - description: User UUID
        in: body
        name: GUID
        required: true
        schema:
          $ref: '#/definitions/storage.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      summary: LoginHandler
      tags:
      - Auth
  /logout:
    delete:
      description: Delete user's authentication data from the database
      parameters:
      - description: User UUID
        in: body
        name: GUID
        required: true
        schema:
          $ref: '#/definitions/app.GUIDstr'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged out
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out user
      tags:
      - Auth
  /refresh:
    post:
      description: Refresh JWT and refresh token using the previous refresh token
      parameters:
      - description: Tokens
        in: body
        name: Tokens
        required: true
        schema:
          $ref: '#/definitions/storage.Tokens'
      produces:
      - application/json
      responses:
        "202":
          description: Tokens successfully refreshed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh JWT and refresh token
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Register a user by email and receive a UUID
      parameters:
      - description: User EMAIL
        in: body
        name: EMAIL
        required: true
        schema:
          $ref: '#/definitions/app.Email'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully registered
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
